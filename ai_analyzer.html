<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محلل الذكاء الاصطناعي الفائق | AI Chess Analyzer</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <!-- إضافة مكتبة الرسم البياني Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #0f0e0d;
      --card-bg: #1a1917;
      --border-color: #2e2c29;
      --green-accent: #81b64c;
      --ai-blue: #38bdf8;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .app-card {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-tag {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      color: var(--ai-blue);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .accuracy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .acc-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .acc-item.w { border-bottom: 4px solid #ffffff; }
    .acc-item.b { border-bottom: 4px solid #64748b; }

    .acc-val { font-size: 24px; font-weight: 900; color: #fff; }
    .acc-lbl { font-size: 11px; color: var(--text-muted); }

    .banner-eval {
      background: #24221f;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill-score {
      background: #ffffff;
      color: #000000;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 15px;
    }

    .board-container {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .eval-bar-v {
      width: 16px;
      background: #262421;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .eval-fill-v {
      width: 100%;
      height: 50%;
      background: #ffffff;
      transition: height 0.3s ease-in-out;
    }

    .board-box { flex: 1; position: relative; }
    #board { width: 100% !important; border-radius: 6px; overflow: hidden; }

    .moves-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      gap: 6px;
    }

    .move-btn {
      background: #2b2823;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .move-btn.active { background: var(--green-accent); color: #000; font-weight: bold; }

    .ctrl-row { display: flex; gap: 8px; }
    .ctrl-btn { background: #252320; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; flex: 1; font-weight: bold; }
    .btn-next { background: var(--green-accent); color: #000; flex: 2; }

    textarea {
      width: 100%; height: 75px;
      background: #151413; border: 1px solid var(--border-color);
      color: #fff; border-radius: 8px; padding: 10px; font-size: 12px; resize: none;
    }

    .btn-submit {
      background: linear-gradient(135deg, #81b64c, #659338);
      border: none; color: #000;
      padding: 14px; border-radius: 8px; font-weight: 800;
      cursor: pointer; width: 100%; font-size: 15px;
      box-shadow: 0 4px 12px rgba(129, 182, 76, 0.2);
    }

    .status-msg {
      text-align: center; font-size: 13px; color: var(--ai-blue);
      font-weight: bold; display: none;
    }

    .square-badge {
      position: absolute; top: -6px; right: -6px;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #fff; z-index: 99;
      border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }

    .bg-brilliant { background: #1baaa0; }
    .bg-great { background: #4b82b6; }
    .bg-best { background: #769656; }
    .bg-excellent { background: #85a94e; }
    .bg-good { background: #87a96b; }
    .bg-book { background: #d5a47d; }
    .bg-inaccuracy { background: #f0c15c; }
    .bg-mistake { background: #e6912c; }
    .bg-miss { background: #fa6555; }
    .bg-blunder { background: #ca3431; }
  </style>
</head>
<body>

  <div class="app-card">
    
    <div class="header-tag">🤖 تحليل الذكاء الاصطناعي (AI Stockfish Engine)</div>

    <div class="accuracy-grid">
      <div class="acc-item w">
        <div>
          <div class="acc-lbl">دقة الأبيض</div>
          <div id="whiteAcc" class="acc-val">--</div>
        </div>
        <span style="font-size:24px;">♔</span>
      </div>
      <div class="acc-item b">
        <div>
          <div class="acc-lbl">دقة الأسود</div>
          <div id="blackAcc" class="acc-val">--</div>
        </div>
        <span style="font-size:24px;">♚</span>
      </div>
    </div>

    <!-- صندوق رسالة المدرب -->
    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; gap: 10px; align-items: center;">
      <div id="coachIcon" style="font-size: 35px;">🦉</div>
      <div id="coachText" style="font-size: 13px; color: var(--text-main); line-height: 1.5;">
        أهلاً بك في التحليل الفائق! الصق الـ PGN واضغط للبدء لنرى التفاصيل الدقيقة لمباراتك.
      </div>
    </div>

    <div class="banner-eval">
      <div id="scorePill" class="pill-score">+0.0</div>
      <div>
        <div id="moveTitle" style="font-weight:bold; font-size:14px;">جاهز للتحليل الفائق</div>
        <div id="moveSub" style="font-size:12px; color:var(--text-muted);">الصق الـ PGN واضغط للبدء</div>
      </div>
    </div>

    <div class="board-container">
      <div class="eval-bar-v"><div id="evalFill" class="eval-fill-v"></div></div>
      <div class="board-box"><div id="board"></div></div>
    </div>

    <div id="movesBar" class="moves-bar"></div>

    <!-- المخطط البياني للتقييم -->
    <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; height: 80px;">
      <canvas id="evalChart"></canvas>
    </div>

    <div class="ctrl-row">
      <button id="btnPrev" class="ctrl-btn">‹</button>
      <button id="btnNext" class="ctrl-btn btn-next">التالي ❯</button>
    </div>

    <textarea id="pgnInput" placeholder="الصق PGN المباراة هنا..."></textarea>
    <div id="statusMsg" class="status-msg">جاري التحليل السحابي عبر الذكاء الاصطناعي...</div>
    <button id="btnRun" class="btn-submit">بدء التحليل الفائق الدقة ⚡</button>

  </div>

  <script>
    var board = null;
    var historyMoves = [];
    var analysisResults = [];
    var currentIndex = -1;
    var evalChart = null; // متغير المخطط البياني

    function calcWinChance(cp) {
      return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
    }

    $(document).ready(function() {
      board = Chessboard('board', {
        position: 'start',
        draggable: false,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      });

      $(window).on('resize', function() { if (board) board.resize(); });
      $('#btnRun').click(startAIAnalysis);
      $('#btnNext').click(function() { renderStep(currentIndex + 1); });
      $('#btnPrev').click(function() { renderStep(currentIndex - 1); });
    });

    async function startAIAnalysis() {
      var pgnText = $('#pgnInput').val().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
      var chess = new Chess();

      if (!chess.load_pgn(pgnText)) {
        alert("تأكد من إدخال PGN صحيح للمباراة!");
        return;
      }

      historyMoves = chess.history({ verbose: true });
      $('#btnRun').prop('disabled', true);
      $('#statusMsg').show();

      var sim = new Chess();
      var fens = [sim.fen()];

      for (var i = 0; i < historyMoves.length; i++) {
        sim.move(historyMoves[i]);
        fens.push(sim.fen());
      }

      var evals = [];

      for (var k = 0; k < fens.length; k++) {
        $('#statusMsg').text('تحليل النقلة الذكية (' + k + ' من ' + (fens.length - 1) + ')...');
        var cp = await fetchAIEval(fens[k]);
        evals.push(cp);
        await new Promise(r => setTimeout(r, 70));
      }

      processAnalysis(evals);
      renderMovesList();
      drawChart(evals); // تشغيل الرسم البياني
      renderStep(-1);

      $('#statusMsg').hide();
      $('#btnRun').prop('disabled', false);
      $('#coachText').text('تم التحليل بنجاح! استخدم الأزرار لمراجعة المباراة بالتفصيل.');
      $('#coachIcon').text('✅');
    }

    async function fetchAIEval(fen) {
      try {
        var res = await fetch('https://lichess.org/api/cloud-eval?fen=' + encodeURIComponent(fen));
        if (!res.ok) return fallbackLocalEval(fen);
        var data = await res.json();
        
        if (data && data.pvs && data.pvs[0]) {
          var pv = data.pvs[0];
          if (pv.cp !== undefined) return pv.cp;
          if (pv.mate !== undefined) return pv.mate > 0 ? 10000 : -10000;
        }
        return fallbackLocalEval(fen);
      } catch (e) {
        return fallbackLocalEval(fen);
      }
    }

    function fallbackLocalEval(fen) {
      var c = new Chess(fen);
      if (c.in_checkmate()) return c.turn() === 'w' ? -10000 : 10000;
      var val = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      var score = 0;
      var b = c.board();
      for (var r=0; r<8; r++) {
        for (var col=0; col<8; col++) {
          var p = b[r][col];
          if (p) score += (p.color === 'w' ? val[p.type] : -val[p.type]);
        }
      }
      return score;
    }

    function processAnalysis(evals) {
      analysisResults = [];
      var wDrops = [], bDrops = [];

      for (var i = 0; i < historyMoves.length; i++) {
        var m = historyMoves[i];
        var side = (i % 2 === 0) ? 'w' : 'b';
        var prevCp = evals[i];
        var curCp = evals[i+1];

        var prevWin = calcWinChance(side === 'w' ? prevCp : -prevCp);
        var curWin = calcWinChance(side === 'w' ? curCp : -curCp);
        var drop = Math.max(0, prevWin - curWin);

        var badge = { name: 'جيدة', icon: '✓', bg: 'bg-good' };

        if (i < 6) {
          badge = { name: 'كتاب', icon: '📖', bg: 'bg-book' };
        } else if (drop > 22) {
          badge = { name: 'خطأ فادح', icon: '??', bg: 'bg-blunder' };
        } else if (drop > 13) {
          badge = { name: 'أضاعت فرصة', icon: '✖', bg: 'bg-miss' };
        } else if (drop > 7) {
          badge = { name: 'خطأ', icon: '?', bg: 'bg-mistake' };
        } else if (drop > 3.5) {
          badge = { name: 'غير دقيقة', icon: '?!', bg: 'bg-inaccuracy' };
        } else if (drop <= 0 && (m.captured || drop < -4)) {
          badge = { name: 'رائعة', icon: '!', bg: 'bg-great' };
        } else {
          badge = { name: 'الأفضل', icon: '★', bg: 'bg-best' };
        }

        if (side === 'w') wDrops.push(drop); else bDrops.push(drop);

        analysisResults.push({
          eval: (curCp / 100).toFixed(1),
          san: m.san,
          to: m.to,
          badge: badge
        });
      }

      function getCAPSAccuracy(drops) {
        if (!drops.length) return "0.0%";
        var total = 0;
        drops.forEach(d => {
          var acc = 103 * Math.exp(-0.035 * d);
          total += Math.min(100, acc);
        });
        return (total / drops.length).toFixed(1) + "%";
      }

      $('#whiteAcc').text(getCAPSAccuracy(wDrops));
      $('#blackAcc').text(getCAPSAccuracy(bDrops));
    }

    function renderMovesList() {
      var box = $('#movesBar').empty();
      historyMoves.forEach((m, i) => {
        box.append('<button id="mbtn-'+i+'" class="move-btn" onclick="renderStep('+i+')">'+m.san+'</button>');
      });
    }

    function renderStep(idx) {
      if (idx < -1 || idx >= historyMoves.length) return;
      var c = new Chess();
      for (var i = 0; i <= idx; i++) c.move(historyMoves[i]);

      currentIndex = idx;
      board.position(c.fen());
      $('.square-badge').remove();

      // رسائل المدرب المخصصة لكل نقلة
      const coachMessages = {
        'جيدة': 'نقلة جيدة تحافظ على توازن اللعب.',
        'كتاب': 'هذه النقلة من نظريات الافتتاحيات المعروفة.',
        'خطأ فادح': 'انتبه! لقد ارتكبت خطأ فادحاً هنا.',
        'أضاعت فرصة': 'كان بإمكانك الحصول على أفضلية أكبر في هذا الموقف.',
        'خطأ': 'هذا خطأ تكتيكي منح الأفضلية لخصمك.',
        'غير دقيقة': 'نقلة غير دقيقة، كان من الأفضل التفكير بخيار آخر.',
        'رائعة': 'نقلة استثنائية! لقد فاجأت المحرك بهذه الرؤية.',
        'الأفضل': 'أفضل خيار متاح على الرقعة.'
      };

      if (idx >= 0) {
        var item = analysisResults[idx];
        var ev = parseFloat(item.eval);
        var scoreTxt = ev > 0 ? '+' + item.eval : item.eval;

        $('#scorePill').text(scoreTxt);
        $('#moveTitle').text(item.san + ' - ' + item.badge.name);
        $('#moveSub').text('تقييم المحرك: ' + scoreTxt);

        // تحديث رسالة المدرب
        $('#coachText').text(coachMessages[item.badge.name] || 'نقلة ممتازة.');
        $('#coachIcon').text(item.badge.icon);

        var sq = $('#board').find('.square-' + item.to);
        if (sq.length) {
          sq.append('<div class="square-badge ' + item.badge.bg + '">' + item.badge.icon + '</div>');
        }

        var fillH = Math.max(5, Math.min(95, 50 + (ev * 8)));
        $('#evalFill').css('height', fillH + '%');

        // تحديث النقطة النشطة في المخطط البياني
        if (evalChart) {
          evalChart.setActiveElements([{ datasetIndex: 0, index: idx + 1 }]);
          evalChart.tooltip.setActiveElements([{ datasetIndex: 0, index: idx + 1 }]);
          evalChart.update();
        }

      } else {
        $('#scorePill').text('+0.0');
        $('#moveTitle').text('بداية المباراة');
        $('#moveSub').text('اضغط التالي لتعرض النقلات');
        $('#evalFill').css('height', '50%');
        $('#coachText').text('جاهز للبدء. دعنا نرى ما حدث في هذه المباراة.');
        $('#coachIcon').text('🦉');
      }

      $('.move-btn').removeClass('active');
      if (idx >= 0) $('#mbtn-' + idx).addClass('active');
    }

    // دالة رسم المخطط البياني
    function drawChart(evals) {
      if (evalChart) evalChart.destroy();
      var ctx = document.getElementById('evalChart').getContext('2d');
      
      var dataPoints = evals.map(e => Math.max(-10, Math.min(10, e / 100)));
      var labels = evals.map((_, i) => i);

      evalChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: dataPoints,
            borderColor: '#38bdf8', // لون الخط أزرق (AI Blue) ليناسب ثيم هذه الصفحة
            backgroundColor: 'rgba(56, 189, 248, 0.15)',
            borderWidth: 2,
            fill: true,
            pointRadius: 1,
            pointHoverRadius: 6,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: { x: { display: false }, y: { display: false, min: -10, max: 10 } },
          plugins: { 
            legend: { display: false },
            tooltip: { enabled: false } 
          }
        }
      });
    }
  </script>
</body>
</html>
