<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>محلل الشطرنج الذكي | AI Chess Analyzer</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    :root {
      --bg: #0e0e11;
      --card: #18181c;
      --accent: #81b64c;
      --ai-cyan: #38bdf8;
      --border: #282830;
      --text: #ffffff;
      --dim: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-badge {
      background: linear-gradient(135deg, #1e1b4b, #0f172a);
      border: 1px solid #3730a3;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      color: var(--ai-cyan);
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
    }

    .accuracy-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .acc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .acc-card.w { border-bottom: 4px solid #ffffff; }
    .acc-card.b { border-bottom: 4px solid #64748b; }

    .acc-val { font-size: 24px; font-weight: 900; color: #fff; }
    .acc-lbl { font-size: 11px; color: var(--dim); }

    .eval-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .eval-pill {
      background: #ffffff;
      color: #000;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 15px;
    }

    .board-wrap {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .eval-bar {
      width: 16px;
      background: #23232b;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .eval-fill {
      width: 100%;
      height: 50%;
      background: #ffffff;
      transition: height 0.3s ease;
    }

    .board-box { flex: 1; position: relative; }
    #board { width: 100% !important; border-radius: 6px; overflow: hidden; }

    .moves-scroll {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      overflow-x: auto;
      white-space: nowrap;
      display: flex;
      gap: 6px;
    }

    .chip {
      background: #25252e;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active { background: var(--accent); color: #000; font-weight: bold; }

    .controls { display: flex; gap: 8px; }
    .btn { background: #23232b; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; flex: 1; font-weight: bold; }
    .btn-next { background: var(--accent); color: #000; flex: 2; }

    textarea {
      width: 100%; height: 75px;
      background: #121215; border: 1px solid var(--border);
      color: #fff; border-radius: 8px; padding: 10px; font-size: 12px; resize: none;
    }

    .btn-analyze {
      background: linear-gradient(135deg, #81b64c, #649635);
      border: none; color: #000;
      padding: 14px; border-radius: 8px; font-weight: 900;
      cursor: pointer; width: 100%; font-size: 15px;
      box-shadow: 0 4px 12px rgba(129, 182, 76, 0.25);
    }

    .status {
      text-align: center; font-size: 13px; color: var(--ai-cyan);
      font-weight: bold; display: none;
    }

    .square-badge {
      position: absolute; top: -6px; right: -6px;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #fff; z-index: 99;
      border: 2px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }

    .bg-brilliant { background: #1baaa0; }
    .bg-great { background: #4b82b6; }
    .bg-best { background: #769656; }
    .bg-good { background: #87a96b; }
    .bg-book { background: #d5a47d; }
    .bg-inaccuracy { background: #f0c15c; }
    .bg-mistake { background: #e6912c; }
    .bg-miss { background: #fa6555; }
    .bg-blunder { background: #ca3431; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="header-badge">⚡ محلل الذكاء الاصطناعي المباشر (AI Engine)</div>

    <div class="accuracy-row">
      <div class="acc-card w">
        <div>
          <div class="acc-lbl">دقة الأبيض</div>
          <div id="whiteAcc" class="acc-val">--</div>
        </div>
        <span style="font-size:24px;">♔</span>
      </div>
      <div class="acc-card b">
        <div>
          <div class="acc-lbl">دقة الأسود</div>
          <div id="blackAcc" class="acc-val">--</div>
        </div>
        <span style="font-size:24px;">♚</span>
      </div>
    </div>

    <div class="eval-banner">
      <div id="evalPill" class="eval-pill">+0.0</div>
      <div>
        <div id="moveTitle" style="font-weight:bold; font-size:14px;">جاهز للتحليل تلقائياً</div>
        <div id="moveSub" style="font-size:12px; color:var(--dim);">الصق الـ PGN واضغط للبدء المباشر</div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="eval-bar"><div id="evalFill" class="eval-fill"></div></div>
      <div class="board-box"><div id="board"></div></div>
    </div>

    <div id="movesBar" class="moves-scroll"></div>

    <div class="controls">
      <button id="btnPrev" class="btn">‹</button>
      <button id="btnNext" class="btn btn-next">التالي ❯</button>
    </div>

    <textarea id="pgnInput" placeholder="الصق PGN المباراة هنا..."></textarea>
    <div id="status" class="status">جاري التحليل بالذكاء الاصطناعي...</div>
    <button id="btnAnalyze" class="btn-analyze">بدء التحليل الفوري ⚡</button>

  </div>

  <script>
    var board = null;
    var historyMoves = [];
    var analysis = [];
    var currentIndex = -1;

    function winChance(cp) {
      return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
    }

    $(document).ready(function() {
      board = Chessboard('board', {
        position: 'start',
        draggable: false,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      });

      $(window).on('resize', function() { if (board) board.resize(); });
      $('#btnAnalyze').click(runAIAnalysis);
      $('#btnNext').click(function() { renderStep(currentIndex + 1); });
      $('#btnPrev').click(function() { renderStep(currentIndex - 1); });
    });

    async function runAIAnalysis() {
      var pgn = $('#pgnInput').val().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
      var g = new Chess();

      if (!g.load_pgn(pgn)) {
        alert("الرجاء التأكد من صحة الـ PGN!");
        return;
      }

      historyMoves = g.history({ verbose: true });
      $('#btnAnalyze').prop('disabled', true);
      $('#status').show();

      var sim = new Chess();
      var fens = [sim.fen()];

      for (var i = 0; i < historyMoves.length; i++) {
        sim.move(historyMoves[i]);
        fens.push(sim.fen());
      }

      var evalScores = [];

      // التحليل المباشر بالذكاء الاصطناعي عبر السيرفر الخارجي
      for (var k = 0; k < fens.length; k++) {
        $('#status').text('الذكاء الاصطناعي يفحص النقلة (' + k + ' من ' + (fens.length - 1) + ')...');
        var cp = await fetchAIEval(fens[k]);
        evalScores.push(cp);
        await new Promise(r => setTimeout(r, 60));
      }

      calculateResults(evalScores);
      renderMovesList();
      renderStep(-1);

      $('#status').hide();
      $('#btnAnalyze').prop('disabled', false);
    }

    async function fetchAIEval(fen) {
      try {
        var res = await fetch('https://lichess.org/api/cloud-eval?fen=' + encodeURIComponent(fen));
        if (!res.ok) return 0;
        var data = await res.json();
        if (data && data.pvs && data.pvs[0]) {
          var pv = data.pvs[0];
          if (pv.cp !== undefined) return pv.cp;
          if (pv.mate !== undefined) return pv.mate > 0 ? 10000 : -10000;
        }
        return 0;
      } catch (e) {
        return 0;
      }
    }

    function calculateResults(evals) {
      analysis = [];
      var wDrops = [], bDrops = [];

      for (var i = 0; i < historyMoves.length; i++) {
        var m = historyMoves[i];
        var side = (i % 2 === 0) ? 'w' : 'b';
        var prevWin = winChance(side === 'w' ? evals[i] : -evals[i]);
        var curWin = winChance(side === 'w' ? evals[i+1] : -evals[i+1]);
        var drop = Math.max(0, prevWin - curWin);

        var badge = { name: 'جيدة', icon: '✓', bg: 'bg-good' };

        if (i < 6) {
          badge = { name: 'كتاب', icon: '📖', bg: 'bg-book' };
        } else if (drop > 22) {
          badge = { name: 'خطأ فادح', icon: '??', bg: 'bg-blunder' };
        } else if (drop > 13) {
          badge = { name: 'أضاعت فرصة', icon: '✖', bg: 'bg-miss' };
        } else if (drop > 7) {
          badge = { name: 'خطأ', icon: '?', bg: 'bg-mistake' };
        } else if (drop > 3.5) {
          badge = { name: 'غير دقيقة', icon: '?!', bg: 'bg-inaccuracy' };
        } else if (drop <= 0 && m.captured) {
          badge = { name: 'رائعة', icon: '!', bg: 'bg-great' };
        } else {
          badge = { name: 'الأفضل', icon: '★', bg: 'bg-best' };
        }

        if (side === 'w') wDrops.push(drop); else bDrops.push(drop);

        analysis.push({
          eval: (evals[i+1] / 100).toFixed(1),
          san: m.san,
          to: m.to,
          badge: badge
        });
      }

      function getAcc(drops) {
        if (!drops.length) return "0.0%";
        var total = 0;
        drops.forEach(d => total += Math.min(100, 103 * Math.exp(-0.035 * d)));
        return (total / drops.length).toFixed(1) + "%";
      }

      $('#whiteAcc').text(getAcc(wDrops));
      $('#blackAcc').text(getAcc(bDrops));
    }

    function renderMovesList() {
      var box = $('#movesBar').empty();
      historyMoves.forEach((m, i) => {
        box.append('<button id="mchip-'+i+'" class="chip" onclick="renderStep('+i+')">'+m.san+'</button>');
      });
    }

    function renderStep(idx) {
      if (idx < -1 || idx >= historyMoves.length) return;
      var g = new Chess();
      for (var i = 0; i <= idx; i++) g.move(historyMoves[i]);

      currentIndex = idx;
      board.position(g.fen());
      $('.square-badge').remove();

      if (idx >= 0) {
        var item = analysis[idx];
        var ev = parseFloat(item.eval);
        var scoreTxt = ev > 0 ? '+' + item.eval : item.eval;

        $('#evalPill').text(scoreTxt);
        $('#moveTitle').text(item.san + ' - ' + item.badge.name);
        $('#moveSub').text('تقييم الذكاء الاصطناعي: ' + scoreTxt);

        var sq = $('#board').find('.square-' + item.to);
        if (sq.length) {
          sq.append('<div class="square-badge ' + item.badge.bg + '">' + item.badge.icon + '</div>');
        }

        var fillH = Math.max(5, Math.min(95, 50 + (ev * 8)));
        $('#evalFill').css('height', fillH + '%');
      } else {
        $('#evalPill').text('+0.0');
        $('#moveTitle').text('بداية المباراة');
        $('#moveSub').text('اضغط التالي لعرض النقلات');
        $('#evalFill').css('height', '50%');
      }

      $('.chip').removeClass('active');
      if (idx >= 0) $('#mchip-' + idx).addClass('active');
    }
  </script>
</body>
</html>
