<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مراجعة المباراة | Chess Review</title>
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="review-app">
    
    <!-- البانر العلوي لشرح النقلات -->
    <div class="header-banner">
      <div class="coach-avatar">♟️</div>
      <div class="banner-content">
        <div class="eval-pill" id="evalScore">+0.0</div>
        <div class="banner-text">
          <div id="moveTitle" class="move-title">مراجعة المباراة</div>
          <div id="moveDescription" class="move-desc">الصق PGN للبدء في التحليل السلس</div>
        </div>
      </div>
    </div>

    <!-- منطقة الرقعة والشريط الجانبي للتقييم -->
    <div class="board-container">
      <div class="eval-bar-wrapper">
        <div id="evalBarFill" class="eval-bar-fill"></div>
      </div>

      <div id="board" class="chess-board"></div>
    </div>

    <!-- شريط النقلات الأفقي (مثل بالفيديو) -->
    <div class="moves-history-bar">
      <div id="movesContainer" class="moves-scroll"></div>
    </div>

    <!-- أزرار التحكم السفلية الضخمة -->
    <div class="controls-bar">
      <button id="btnPrev" class="ctrl-btn">‹</button>
      <button id="btnNext" class="ctrl-btn btn-next">التالي ❯</button>
      <button id="btnAuto" class="ctrl-btn">▶</button>
    </div>

    <!-- قسم رفع التحليل والـ PGN -->
    <div class="input-section">
      <textarea id="pgnInput" placeholder="الصق PGN المباراة هنا..."></textarea>
      <div class="actions">
        <button id="btnAnalyze" class="btn-main">تحليل المباراة</button>
      </div>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
