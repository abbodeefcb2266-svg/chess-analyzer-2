<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مراجعة المباراة | Chess Review</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  
  <style>
    :root {
      --bg-color: #161512;
      --card-bg: #21201d;
      --banner-bg: #262421;
      --green-accent: #81b64c;
      --text-white: #ffffff;
      --text-dim: #bababa;
      
      /* ألوان Chess.com الرسمية للتقييمات */
      --c-best: #81b64c;      /* ⭐ أفضل نقلة */
      --c-great: #5c8bb0;     /* ‼️ نقلة رائعة - مثل الصورة */
      --c-good: #96bc4b;      /* ✔️ نقلة ممتازة */
      --c-inaccuracy: #f0c15c;/* ⁉️ غير دقيقة */
      --c-mistake: #e6912c;   /* ❓ خطأ */
      --c-blunder: #ca3431;   /* ❌ خطأ فادح */
      --c-book: #d5a47d;      /* 📖 نظري */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color) !important;
      color: var(--text-white) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      min-height: 100vh;
    }

    .review-app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* كارت إحصائيات الدقة (Accuracy Cards) */
    .accuracy-section {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .acc-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid #312e2b;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .acc-card.white { border-left: 4px solid #fff; }
    .acc-card.black { border-left: 4px solid #7a7a7a; }

    .acc-info {
      display: flex;
      flex-direction: column;
    }

    .acc-title {
      font-size: 11px;
      color: var(--text-dim);
    }

    .acc-score {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    /* البانر العلوي للنقلة الحالية */
    .header-banner {
      background: var(--banner-bg);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #312e2b;
    }

    .banner-content {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .eval-pill {
      background: #fff;
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .banner-text {
      display: flex;
      flex-direction: column;
    }

    .move-title {
      font-weight: bold;
      font-size: 14px;
    }

    .move-desc {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* الرقعة وشريط التقييم */
    .board-container {
      display: flex;
      gap: 6px;
      width: 100%;
      align-items: stretch;
    }

    .eval-bar-wrapper {
      width: 14px;
      background: #262421;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border: 1px solid #312e2b;
    }

    .eval-bar-fill {
      width: 100%;
      height: 50%;
      background: #ffffff;
      transition: height 0.3s ease;
    }

    .board-box {
      flex: 1;
      width: 100%;
      position: relative;
    }

    #board {
      width: 100% !important;
      position: relative;
    }

    /* شارة التقييم العائمة (مطابقة للصورة بدقة) */
    .square-eval-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      z-index: 999;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      border: 2px solid #fff;
    }

    /* شريط النقلات الأفقي */
    .moves-history-bar {
      background: var(--card-bg);
      border-radius: 6px;
      padding: 8px;
      overflow-x: auto;
      white-space: nowrap;
      border: 1px solid #312e2b;
    }

    .moves-scroll {
      display: flex;
      gap: 6px;
    }

    .chip-move {
      background: #2b2926;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip-move.active {
      background: var(--green-accent);
      font-weight: bold;
    }

    /* أزرار التحكم السفلية */
    .controls-bar {
      display: flex;
      gap: 8px;
    }

    .ctrl-btn {
      background: #2b2926;
      border: 1px solid #312e2b;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
    }

    .btn-next {
      background: var(--green-accent);
      font-weight: bold;
      flex: 2;
    }

    /* إدخال الـ PGN */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 50px;
      background: #181715;
      border: 1px solid #312e2b;
      color: #fff;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      resize: none;
    }

    .btn-main {
      background: var(--green-accent);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .bg-best { background: var(--c-best); }
    .bg-great { background: var(--c-great); }
    .bg-good { background: var(--c-good); }
    .bg-inaccuracy { background: var(--c-inaccuracy); }
    .bg-mistake { background: var(--c-mistake); }
    .bg-blunder { background: var(--c-blunder); }
    .bg-book { background: var(--c-book); }
  </style>
</head>
<body>

  <div class="review-app">
    
    <!-- قسم إحصائيات دقة اللعب -->
    <div class="accuracy-section">
      <div class="acc-card white">
        <div class="acc-info">
          <span class="acc-title">دقة الأبيض</span>
          <span id="whiteAcc" class="acc-score">0.0%</span>
        </div>
        <span>♔</span>
      </div>
      <div class="acc-card black">
        <div class="acc-info">
          <span class="acc-title">دقة الأسود</span>
          <span id="blackAcc" class="acc-score">0.0%</span>
        </div>
        <span>♚</span>
      </div>
    </div>

    <!-- البانر العلوي للنقلة -->
    <div class="header-banner">
      <div class="banner-content">
        <div class="eval-pill" id="evalScore">+0.0</div>
        <div class="banner-text">
          <div id="moveTitle" class="move-title">مراجعة المباراة</div>
          <div id="moveDescription" class="move-desc">الصق PGN للبدء في التحليل</div>
        </div>
      </div>
    </div>

    <!-- الرقعة وشريط التقييم الجانبي -->
    <div class="board-container">
      <div class="eval-bar-wrapper">
        <div id="evalBarFill" class="eval-bar-fill"></div>
      </div>

      <div class="board-box">
        <div id="board"></div>
      </div>
    </div>

    <!-- شريط النقلات الأفقي -->
    <div class="moves-history-bar">
      <div id="movesContainer" class="moves-scroll"></div>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls-bar">
      <button id="btnPrev" class="ctrl-btn">‹</button>
      <button id="btnNext" class="ctrl-btn btn-next">التالي ❯</button>
      <button id="btnAuto" class="ctrl-btn">▶</button>
    </div>

    <!-- قسم رفع PGN -->
    <div class="input-section">
      <textarea id="pgnInput" placeholder="الصق PGN المباراة هنا..."></textarea>
      <button id="btnAnalyze" class="btn-main">تحليل المباراة</button>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    var board = null;
    var game = new Chess();
    var historyMoves = [];
    var moveAnalysis = [];
    var currentMoveIndex = -1;
    var autoplayTimer = null;

    var pieceVal = { p: 1, n: 3, b: 3.25, r: 5, q: 9, k: 0 };

    function calcEval(cGame) {
      var score = 0;
      var b = cGame.board();
      for (var r = 0; r < 8; r++) {
        for (var c = 0; c < 8; c++) {
          var p = b[r][c];
          if (p) score += (p.color === 'w' ? 1 : -1) * (pieceVal[p.type] || 0);
        }
      }
      return parseFloat(score.toFixed(1));
    }

    $(document).ready(function () {
      board = Chessboard('board', {
        position: 'start',
        draggable: false,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      });

      setTimeout(function() {
        if (board) board.resize();
      }, 200);

      $('#btnAnalyze').on('click', function() {
        parsePGN($('#pgnInput').val());
      });
      $('#btnNext').on('click', function() {
        renderStep(currentMoveIndex + 1);
      });
      $('#btnPrev').on('click', function() {
        renderStep(currentMoveIndex - 1);
      });
      $('#btnAuto').on('click', toggleAutoplay);

      $(window).on('resize', function() {
        if (board) board.resize();
      });
    });

    function parsePGN(pgn) {
      var g = new Chess();
      if (!g.load_pgn(pgn)) {
        alert('الرجاء التأكد من صحة كود الـ PGN');
        return;
      }

      historyMoves = g.history({ verbose: true });
      analyzeMoves();
      calculateAccuracy();
      renderHorizontalMoves();
      renderStep(-1);
    }

    function analyzeMoves() {
      var cGame = new Chess();
      moveAnalysis = [];
      var prevVal = 0;

      for (var i = 0; i < historyMoves.length; i++) {
        var m = historyMoves[i];
        cGame.move(m);
        var score = calcEval(cGame);
        var side = i % 2 === 0 ? 'w' : 'b';
        var delta = side === 'w' ? (score - prevVal) : (prevVal - score);

        var info = { name: 'نقلة ممتازة', icon: '✔️', bg: 'bg-good', quality: 90 };

        if (i < 5) {
          info = { name: 'نقلة كتابية', icon: '📖', bg: 'bg-book', quality: 100 };
        } else if (delta >= 0.7) {
          info = { name: 'نقلة رائعة!', icon: '!!', bg: 'bg-great', quality: 100 };
        } else if (delta >= 0.0) {
          info = { name: 'النقلة الأفضل', icon: '⭐', bg: 'bg-best', quality: 98 };
        } else if (delta >= -0.5) {
          info = { name: 'غير دقيقة', icon: '⁉', bg: 'bg-inaccuracy', quality: 70 };
        } else if (delta >= -1.5) {
          info = { name: 'خطأ', icon: '❓', bg: 'bg-mistake', quality: 45 };
        } else {
          info = { name: 'خطأ فادح', icon: '❌', bg: 'bg-blunder', quality: 10 };
        }

        moveAnalysis.push({
          eval: score,
          toSquare: m.to,
          san: m.san,
          name: info.name,
          icon: info.icon,
          bg: info.bg,
          quality: info.quality,
          side: side
        });

        prevVal = score;
      }
    }

    function calculateAccuracy() {
      var wSum = 0, wCount = 0;
      var bSum = 0, bCount = 0;

      moveAnalysis.forEach(function(item) {
        if (item.side === 'w') {
          wSum += item.quality;
          wCount++;
        } else {
          bSum += item.quality;
          bCount++;
        }
      });

      var wAcc = wCount > 0 ? (wSum / wCount).toFixed(1) : '0.0';
      var bAcc = bCount > 0 ? (bSum / bCount).toFixed(1) : '0.0';

      $('#whiteAcc').text(wAcc + '%');
      $('#blackAcc').text(bAcc + '%');
    }

    function renderStep(idx) {
      if (idx < -1 || idx >= historyMoves.length) return;

      var g = new Chess();
      for (var i = 0; i <= idx; i++) g.move(historyMoves[i]);

      currentMoveIndex = idx;
      board.position(g.fen());

      $('.square-eval-badge').remove();

      if (idx >= 0) {
        var item = moveAnalysis[idx];
        var scoreStr = item.eval > 0 ? '+' + item.eval : item.eval;
        
        $('#evalScore').text(scoreStr);
        $('#moveTitle').text(item.san + ' - ' + item.name);
        $('#moveDescription').text('تقييم الموقف: ' + scoreStr);

        var targetSquare = $('#board').find('.square-' + item.toSquare);
        if (targetSquare.length) {
          targetSquare.append('<div class="square-eval-badge ' + item.bg + '">' + item.icon + '</div>');
        }

        var height = 50 + (item.eval * 8);
        height = Math.max(5, Math.min(95, height));
        $('#evalBarFill').css('height', height + '%');
      } else {
        $('#evalScore').text('+0.0');
        $('#moveTitle').text('بداية المباراة');
        $('#moveDescription').text('جاهز للتحليل');
        $('#evalBarFill').css('height', '50%');
      }

      $('.chip-move').removeClass('active');
      if (idx >= 0) $('#chip-' + idx).addClass('active');
    }

    function renderHorizontalMoves() {
      var container = $('#movesContainer');
      container.empty();

      historyMoves.forEach(function(m, i) {
        var btn = '<button id="chip-' + i + '" class="chip-move" onclick="renderStep(' + i + ')">' + m.san + '</button>';
        container.append(btn);
      });
    }

    function toggleAutoplay() {
      if (autoplayTimer) {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
        $('#btnAuto').text('▶');
      } else {
        $('#btnAuto').text('⏸');
        autoplayTimer = setInterval(function() {
          if (currentMoveIndex < historyMoves.length - 1) {
            renderStep(currentMoveIndex + 1);
          } else {
            toggleAutoplay();
          }
        }, 1000);
      }
    }
  </script>
</body>
</html>
