<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محلل الشطرنج الاحترافي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a2e; min-height: 100vh; color: #eee; }
    .header { text-align: center; padding: 30px 20px 10px; }
    .header h1 { color: #e94560; font-size: 2.5em; margin-bottom: 10px; }
    .header p { color: #aaa; font-size: 1.1em; }
    .main-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; max-width: 1200px; margin: 0 auto; padding: 20px; }
    .board-section { display: flex; flex-direction: column; align-items: center; }
    .chess-board { display: grid; grid-template-columns: repeat(8, 60px); grid-template-rows: repeat(8, 60px); border: 3px solid #e94560; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .square { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; position: relative; }
    .square.light { background: #f0d9b5; }
    .square.dark { background: #b58863; }
    .square:hover { filter: brightness(1.15); }
    .square.selected { box-shadow: inset 0 0 0 4px #e94560; }
    .square.last-move { box-shadow: inset 0 0 0 3px #4ecca3; }
    .square.legal-move::after { content: ''; position: absolute; width: 16px; height: 16px; background: rgba(78, 204, 163, 0.6); border-radius: 50%; }
    .square.legal-move.capture::after { width: 100%; height: 100%; background: rgba(78, 204, 163, 0.25); border-radius: 0; border: 3px solid rgba(78, 204, 163, 0.6); }
    .square.check { background: #ff6b6b !important; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
    .coord { width: 60px; text-align: center; color: #888; font-size: 12px; padding: 4px 0; }
    .coord-rank { display: flex; flex-direction: column; }
    .coord-rank span { height: 60px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 12px; width: 24px; }
    .board-with-coords { display: flex; }
    .panel { background: #16213e; border-radius: 12px; padding: 20px; min-width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .panel h2 { color: #e94560; margin-bottom: 15px; font-size: 1.3em; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .eval-bar-container { width: 30px; height: 300px; background: #333; border-radius: 4px; position: relative; overflow: hidden; border: 1px solid #444; }
    .eval-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, #fff 0%, #fff 50%, #333 50%, #333 100%); transition: height 0.5s ease; }
    .eval-text { font-size: 1.5em; font-weight: bold; color: #4ecca3; }
    .move-list { max-height: 300px; overflow-y: auto; background: #0f3460; border-radius: 8px; padding: 10px; font-family: monospace; }
    .move-row { display: flex; gap: 10px; padding: 4px 8px; border-radius: 4px; }
    .move-row:hover { background: #1a1a2e; }
    .move-num { color: #888; width: 30px; }
    .move-white, .move-black { color: #fff; cursor: pointer; padding: 2px 8px; border-radius: 3px; }
    .move-white:hover, .move-black:hover { background: #e94560; }
    .move-current { background: #e94560; }
    .controls { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; font-weight: 600; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #ff6b81; transform: translateY(-2px); }
    .btn-secondary { background: #0f3460; color: #fff; }
    .btn-secondary:hover { background: #1a4a7a; }
    .analysis-line { background: #0f3460; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.95em; }
    .analysis-line .eval { color: #4ecca3; font-weight: bold; }
    .analysis-line .best { color: #ffd700; }
    .fen-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f3460; color: #fff; font-family: monospace; font-size: 12px; margin-top: 10px; }
    .status-bar { text-align: center; padding: 10px; background: #0f3460; border-radius: 8px; margin-top: 10px; font-size: 1.1em; }
    .status-bar.checkmate { color: #ff6b6b; }
    .status-bar.stalemate { color: #ffd700; }
    .status-bar.check { color: #ff9f43; }
    .promotion-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .promotion-modal.active { display: flex; }
    .promotion-options { background: #16213e; padding: 20px; border-radius: 12px; display: flex; gap: 15px; }
    .promotion-piece { width: 55px; height: 55px; cursor: pointer; padding: 5px; border-radius: 8px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .promotion-piece:hover { background: #e94560; transform: scale(1.2); }
    .piece-svg { width: 90%; height: 90%; }
    .piece-wrap { width: 85%; height: 85%; display: flex; align-items: center; justify-content: center; }
    @media (max-width: 768px) {
      .chess-board { grid-template-columns: repeat(8, 45px); grid-template-rows: repeat(8, 45px); }
      .square { width: 45px; height: 45px; }
      .coord { width: 45px; }
      .coord-rank span { height: 45px; }
      .main-container { gap: 15px; }
      .panel { min-width: 280px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>♔ محلل الشطرنج الاحترافي ♚</h1>
    <p>حلل نقلاتك، قيّم وضعياتك، وطوّر لعبك</p>
  </div>

  <div class="main-container">
    <div class="board-section">
      <div class="board-with-coords">
        <div class="coord-rank" id="rank-coords"></div>
        <div>
          <div class="chess-board" id="board"></div>
          <div style="display:flex;" id="file-coords"></div>
        </div>
      </div>
      <div class="status-bar" id="status">دور الأبيض للعب</div>
      <div class="controls">
        <button class="btn btn-secondary" onclick="undoMove()">↩ تراجع</button>
        <button class="btn btn-secondary" onclick="resetBoard()">🔄 جديد</button>
        <button class="btn btn-primary" onclick="flipBoard()">🔃 اقلب اللوحة</button>
        <button class="btn btn-primary" onclick="analyzePosition()">📊 حلّل</button>
      </div>
      <input type="text" class="fen-input" id="pgn-input" placeholder="أدخل PGN هنا..." onkeypress="if(event.key==='Enter')loadPGN()">
      <div class="controls" style="margin-top:8px;">
        <button class="btn btn-secondary" onclick="loadPGN()">📥 تحميل PGN</button>
        <button class="btn btn-secondary" onclick="copyFEN()">📋 نسخ FEN</button>
        <button class="btn btn-secondary" onclick="copyPGN()">📋 نسخ PGN</button>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex; gap:15px; align-items:flex-start;">
        <div class="eval-bar-container">
          <div class="eval-fill" id="eval-fill" style="height:50%"></div>
        </div>
        <div style="flex:1;">
          <h2>📊 التقييم</h2>
          <div class="eval-text" id="eval-text">0.0</div>
          <div style="color:#888; font-size:0.9em; margin-top:5px;" id="eval-desc">وضع متعادل</div>
        </div>
      </div>
      <h2 style="margin-top:20px;">📝 سجل النقلات</h2>
      <div class="move-list" id="move-list"></div>
      <h2 style="margin-top:20px;">🔍 التحليل</h2>
      <div id="analysis-panel">
        <div class="analysis-line"><span style="color:#888">اضغط "حلّل" لتحليل الوضعية الحالية</span></div>
      </div>
    </div>
  </div>

  <div class="promotion-modal" id="promotion-modal">
    <div class="promotion-options" id="promotion-options"></div>
  </div>

          }

              if(target&&this.isEnemy(target))moves.push({from:[r,c],to:[nr,nc],capture:true});

            const nr=r+dr,nc=c+dc;

            const nr=r+dr,nc=c+dc;

          if(!attackOnly){
            const color=this.isWhite(p)?'w':'b';

              if(!this.board[r][1]&&!this.board[r][2]&&!this.board[r][3]&&!this.isInCheck(color)&&!this.isSquareAttacked(r,2,color==='w'?'b':'w')&&!this.isSquareAttacked(r,3,color==='w'?'b':'w'))moves.push({from:[r,c],to:[r,2],castling:'q'});
            }
            if(this.castling[color].k){
              if(!this.board[r][5]&&!this.board[r][6]&&!this.isInCheck(color)&&!this.isSquareAttacked(r,5,color==='w'?'b':'w')&&!this.isSquareAttacked(r,6,color==='w'?'b':'w'))moves.push({from:[r,c],to:[r,6],castling:'k'});

          }

          let dirs=[];
          if(piece==='b'||piece==='q')dirs=dirs.concat([[-1,-1],[-1,1],[1,-1],[1,1]]);
          if(piece==='r'||piece==='q')dirs=dirs.concat([[-1,0],[1,0],[0,-1],[0,1]]);
          for(const[dr,dc]of dirs){
            for(let i=1;i<8;i++){

              if(!this.inBounds(nr,nc))break;
              if(!this.board[nr][nc])moves.push({from:[r,c],to:[nr,nc]});

      }
      generateMoves() {

          if(p&&this.isOwn(p)){

              test._makeRaw(m);
              if(!test.isInCheck(this.turn))all.push(m);
            }
          }
        }
        return all;
      }
      _makeRaw(m) {
        const p=this.board[m.from[0]][m.from[1]];
        this.board[m.to[0]][m.to[1]]=m.promotion||p;
        this.board[m.from[0]][m.from[1]]=null;
        if(m.enPassant){
          const capRow=this.turn==='w'?m.to[0]+1:m.to[0]-1;
          this.board[capRow][m.to[1]]=null;
        }
        if(m.castling){
          const r=m.from[0];
          if(m.castling==='k'){this.board[r][5]=this.board[r][7];this.board[r][7]=null;}
          else{this.board[r][3]=this.board[r][0];this.board[r][0]=null;}
        }
        this.enPassant=null;
        if(p.toLowerCase()==='p'&&Math.abs(m.to[0]-m.from[0])===2)this.enPassant=[(m.from[0]+m.to[0])/2,m.from[1]];
        const color=this.isWhite(p)?'w':'b';
        if(p.toLowerCase()==='k')this.castling[color]={k:false,q:false};
        if(p.toLowerCase()==='r'){

          if(m.from[1]===7)this.castling[color].k=false;
        }
        if(this.board[m.to[0]][m.to[1]] && this.board[m.to[0]][m.to[1]].toLowerCase()==='r'){
          const ec=this.isWhite(this.board[m.to[0]][m.to[1]])?'w':'b';

      makeMove(m) {

        const prev={castling:JSON.parse(JSON.stringify(this.castling)),enPassant:this.enPassant,lastMove:this.lastMove};
        const san = this.moveToSAN(m);
        this._makeRaw(m);

      undo() {

      evaluate() {

      minimax(depth,alpha,beta,maximizing) {

      toFEN() {

          for(const ch of rows[r]){

      moveToSAN(m) {

        let san='';
        if(m.castling)return m.castling==='k'?'O-O':'O-O-O';
        if(piece!=='p')san=p.toUpperCase();
        const files='abcdefgh', ranks='87654321';
        const sameFile=[], sameRank=[];
        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
          const pp=this.board[r][c];
          if(pp&&pp.toLowerCase()===piece&&this.isOwn(pp)&&(r!==m.from[0]||c!==m.from[1])){
            const mm=this._rawMoves(r,c);
            for(const mv of mm)if(mv.to[0]===m.to[0]&&mv.to[1]===m.to[1]){
              if(c===m.from[1])sameRank.push([r,c]);
              if(r===m.from[0])sameFile.push([r,c]);
              if(r!==m.from[0]&&c!==m.from[1]){sameFile.push([r,c]);sameRank.push([r,c]);}
            }
          }
        }
        if(sameFile.length||sameRank.length){
          if(!sameFile.length)san+=files[m.from[1]];
          else if(!sameRank.length)san+=ranks[m.from[0]];
          else san+=files[m.from[1]]+ranks[m.from[0]];
        }
        if(this.board[m.to[0]][m.to[1]]||m.enPassant)san+='x';
        san+=files[m.to[1]]+ranks[m.to[0]];
        if(m.promotion)san+='='+m.promotion.toUpperCase();
        const test=this.copy(); test.makeMove(m);
        if(test.generateMoves().length===0){
          if(test.isInCheck(test.turn==='w'?'b':'w'))san+='#';
          else san+=' (1/2-1/2)';
        } else if(test.isInCheck(test.turn==='w'?'b':'w'))san+='+';

      parseSAN(san) {
        san = san.trim().replace(/[+#]$/, '').replace(' (1/2-1/2)', '');
        if(san==='O-O')return{castling:'k'};
        if(san==='O-O-O')return{castling:'q'};
        let promotion=null;
        if(san.includes('=')){const parts=san.split('=');promotion=parts[1][0].toLowerCase();san=parts[0];}
        const files='abcdefgh',ranks='87654321';
        let toFile=-1,toRank=-1,fromFile=-1,fromRank=-1,piece='p';
        const len=san.length;
        let idx=0;
        if('KQRBN'.includes(san[0])){piece=san[0].toLowerCase();idx++;}
        let capture=false;
        if(san.includes('x')){capture=true;const xi=san.indexOf('x');san=san.slice(0,xi)+san.slice(xi+1);}
        toFile=files.indexOf(san[san.length-2]);
        toRank=ranks.indexOf(san[san.length-1]);
        const mid=san.slice(idx,san.length-2);
        if(mid.length===1){
          if(files.includes(mid[0]))fromFile=files.indexOf(mid[0]);
          else fromRank=ranks.indexOf(mid[0]);
        } else if(mid.length===2){
          fromFile=files.indexOf(mid[0]);
          fromRank=ranks.indexOf(mid[1]);
        }
        for(let r=0;r<8;r++)for(let c=0;c<8;c++){
          const p=this.board[r][c];
          if(!p||p.toLowerCase()!==piece||!this.isOwn(p))continue;
          if(fromFile!==-1&&c!==fromFile)continue;
          if(fromRank!==-1&&r!==fromRank)continue;
          const moves=this._rawMoves(r,c);
          for(const m of moves){
            if(m.to[0]===toRank&&m.to[1]===toFile){
              const test=this.copy();test._makeRaw(m);
              if(!test.isInCheck(this.turn)){
                if(promotion)m.promotion=promotion;
                return m;
              }
            }
          }
        }
        return null;
      }
      fromPGN(pgn) {
        this.reset();
        const clean = pgn.replace(/\{[^}]*\}/g,'').replace(/\[[^\]]*\]/g,'').replace(/\d+\./g,' ').replace(/\s+/g,' ').trim();
        const tokens = clean.split(' ').filter(t=>t && !['1-0','0-1','1/2-1/2','*'].includes(t));
        for(const token of tokens){
          const san = token.replace(/\.\.\./g,'');
          const m = this.parseSAN(san);
          if(m)this.makeMove(m);
        }
      }
      getPGN() {
        let pgn='[Event "تحليل شطرنج"]\n[Site "محلل الشطرنج"]\n[Date "'+new Date().toISOString().split('T')[0]+'"]\n';
        for(let i=0;i<this.moveHistory.length;i+=2){
          pgn+=Math.floor(i/2)+1+'. ';
          pgn+=this.moveHistory[i].san+' ';
          if(this.moveHistory[i+1])pgn+=this.moveHistory[i+1].san+' ';
        }
        return pgn.trim();
      }
    }

    let engine = new ChessEngine();
    let flipped = false;
    let selectedSquare = null;
    let legalMoves = [];
    let pendingPromotion = null;

    function getPieceSVG(p) {
      if (!p) return '';
      return '<div class="piece-wrap">' + SVG_PIECES[p] + '</div>';
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const rr = flipped ? 7 - r : r;
          const cc = flipped ? 7 - c : c;
          const sq = document.createElement('div');
          sq.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
          sq.dataset.r = rr;
          sq.dataset.c = cc;
          const piece = engine.board[rr][cc];
          if (piece) sq.innerHTML = getPieceSVG(piece);
          if (selectedSquare && selectedSquare[0] === rr && selectedSquare[1] === cc) sq.classList.add('selected');
          if (engine.lastMove && ((engine.lastMove.from[0] === rr && engine.lastMove.from[1] === cc) || (engine.lastMove.to[0] === rr && engine.lastMove.to[1] === cc))) sq.classList.add('last-move');
          const lm = legalMoves.find(m => m.to[0] === rr && m.to[1] === cc);
          if (lm) {
            sq.classList.add('legal-move');
            if (engine.board[rr][cc] || lm.enPassant) sq.classList.add('capture');
          }
          if (piece && piece.toLowerCase() === 'k') {
            const color = piece === piece.toUpperCase() ? 'w' : 'b';
            if (engine.isInCheck(color)) sq.classList.add('check');
          }
          sq.onclick = () => onSquareClick(rr, cc);
          board.appendChild(sq);
        }
      }
      renderCoords();
      updateStatus();
      renderMoveList();
      updateEval();
    }

    function renderCoords() {
      const files = document.getElementById('file-coords');
      const ranks = document.getElementById('rank-coords');
      files.innerHTML = '';
      ranks.innerHTML = '';
      const f = ['a','b','c','d','e','f','g','h'];
      for (let i = 0; i < 8; i++) {
        const fc = document.createElement('span');
        fc.className = 'coord';
        fc.textContent = flipped ? f[7-i] : f[i];
        files.appendChild(fc);
      }
      for (let i = 0; i < 8; i++) {
        const rc = document.createElement('span');
        rc.textContent = flipped ? i+1 : 8-i;
        ranks.appendChild(rc);
      }
    }

    function onSquareClick(r, c) {
      const piece = engine.board[r][c];
      if (pendingPromotion) return;
      if (selectedSquare) {
        const move = legalMoves.find(m => m.to[0] === r && m.to[1] === c);
        if (move) {
          const p = engine.board[selectedSquare[0]][selectedSquare[1]];
          if (p.toLowerCase() === 'p' && (r === 0 || r === 7)) {
            pendingPromotion = move;
            renderPromotionModal();
            document.getElementById('promotion-modal').classList.add('active');
            return;
          }
          engine.makeMove(move);
          selectedSquare = null;
          legalMoves = [];
          renderBoard();
          return;
        }
      }
      if (piece && engine.isOwn(piece)) {
        selectedSquare = [r, c];
        legalMoves = engine._rawMoves(r, c).filter(m => {
          const test = engine.copy();
          test._makeRaw(m);
          return !test.isInCheck(engine.turn);
        });
        renderBoard();
      } else {
        selectedSquare = null;
        legalMoves = [];
        renderBoard();
      }
    }

    function renderPromotionModal() {
      const opts = document.getElementById('promotion-options');
      opts.innerHTML = '';
      const pieces = engine.turn === 'w' ? ['Q','R','B','N'] : ['q','r','b','n'];
      for (const p of pieces) {
        const div = document.createElement('div');
        div.className = 'promotion-piece';
        div.innerHTML = getPieceSVG(p);
        div.onclick = () => selectPromotion(p.toLowerCase());
        opts.appendChild(div);
      }
    }

    function selectPromotion(promo) {
      if (pendingPromotion) {
        pendingPromotion.promotion = promo;
        engine.makeMove(pendingPromotion);
        pendingPromotion = null;
        document.getElementById('promotion-modal').classList.remove('active');
        renderBoard();
      }
    }

    function undoMove() {
      engine.undo();
      selectedSquare = null;
      legalMoves = [];
      renderBoard();
    }

    function resetBoard() {
      engine = new ChessEngine();
      selectedSquare = null;
      legalMoves = [];
      renderBoard();
    }

    function flipBoard() {
      flipped = !flipped;
      renderBoard();
    }

    function updateStatus() {
      const moves = engine.generateMoves();
      const status = document.getElementById('status');
      status.className = 'status-bar';
      if (!moves.length) {
        if (engine.isInCheck(engine.turn)) {
          status.textContent = 'كش ملك! ' + (engine.turn === 'w' ? 'الأسود' : 'الأبيض') + ' فاز 🏆';
          status.classList.add('checkmate');
        } else {
          status.textContent = 'تعادل بالجمود 🤝';
          status.classList.add('stalemate');
        }
      } else if (engine.isInCheck(engine.turn)) {
        status.textContent = 'كش! دور ' + (engine.turn === 'w' ? 'الأبيض' : 'الأسود');
        status.classList.add('check');
      } else {
        status.textContent = 'دور ' + (engine.turn === 'w' ? 'الأبيض' : 'الأسود') + ' للعب';
      }
    }

    function renderMoveList() {
      const list = document.getElementById('move-list');
      list.innerHTML = '';
      for (let i = 0; i < engine.moveHistory.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'move-row';
        const num = document.createElement('span');
        num.className = 'move-num';
        num.textContent = Math.floor(i / 2) + 1 + '.';
        row.appendChild(num);
        const w = document.createElement('span');
        w.className = 'move-white';
        w.textContent = engine.moveHistory[i].san;
        if (i === engine.moveHistory.length - 1) w.classList.add('move-current');
        row.appendChild(w);
        if (engine.moveHistory[i + 1]) {
          const b = document.createElement('span');
          b.className = 'move-black';
          b.textContent = engine.moveHistory[i + 1].san;
          if (i + 1 === engine.moveHistory.length - 1) b.classList.add('move-current');
          row.appendChild(b);
        }
        list.appendChild(row);
      }
      list.scrollTop = list.scrollHeight;
    }

    function updateEval() {
      const ev = engine.evaluate();
      const bar = document.getElementById('eval-fill');
      const text = document.getElementById('eval-text');
      const desc = document.getElementById('eval-desc');
      let pct = 50;
      if (Math.abs(ev) > 10000) {
        pct = ev > 0 ? 100 : 0;
        text.textContent = ev > 0 ? '+M' : '-M';
        desc.textContent = ev > 0 ? 'فوز الأبيض مؤكد' : 'فوز الأسود مؤكد';
      } else {
        const clamped = Math.max(-1000, Math.min(1000, ev));
        pct = 50 + (clamped / 1000) * 45;
        text.textContent = (ev >= 0 ? '+' : '') + (ev / 100).toFixed(1);
        if (ev > 300) desc.textContent = 'تفوق واضح للأبيض';
        else if (ev > 100) desc.textContent = 'تفوق طفيف للأبيض';
        else if (ev > -100) desc.textContent = 'وضع متعادل';
        else if (ev > -300) desc.textContent = 'تفوق طفيف للأسود';
        else desc.textContent = 'تفوق واضح للأسود';
      }
      bar.style.height = pct + '%';
    }

    function analyzePosition() {
      const panel = document.getElementById('analysis-panel');
      panel.innerHTML = '<div class="analysis-line"><span style="color:#888">جاري التحليل...</span></div>';
      setTimeout(() => {
        const top = engine.getTopMoves(3, 3);
        panel.innerHTML = '';
        if (!top.length) {
          panel.innerHTML = '<div class="analysis-line">لا توجد نقلات متاحة</div>';
          return;
        }
        top.forEach((t, i) => {
          const line = document.createElement('div');
          line.className = 'analysis-line';
          const san = engine.moveToSAN(t.move);
          let evalText;
          if (Math.abs(t.eval) > 9000) evalText = t.eval > 0 ? '+M' : '-M';
          else evalText = (t.eval >= 0 ? '+' : '') + (t.eval / 100).toFixed(2);
          line.innerHTML = '<span class="' + (i === 0 ? 'best' : 'eval') + '">' + (i + 1) + '. ' + san + ' → ' + evalText + '</span>';
          panel.appendChild(line);
        });
        updateEval();
      }, 100);
    }

    function loadPGN() {
      const pgn = document.getElementById('pgn-input').value.trim();
      if (!pgn) return;
      try {
        engine.fromPGN(pgn);
        selectedSquare = null;
        legalMoves = [];
        renderBoard();
      } catch (e) {
        alert('PGN غير صالح');
      }
    }

    function copyFEN() {
      navigator.clipboard.writeText(engine.toFEN());
      alert('تم نسخ FEN!');
    }

    function copyPGN() {
      navigator.clipboard.writeText(engine.getPGN());
      alert('تم نسخ PGN!');
    }

    renderBoard();
  </script>
</body>
</html>
