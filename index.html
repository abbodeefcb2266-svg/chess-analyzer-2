<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محلل الشطرنج الاحترافي | PGN Analyzer</title>
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="board-section">
      <div class="game-info" id="gameInfo">
        <span id="playerWhite">الأبيض</span> vs <span id="playerBlack">الأسود</span>
        <span class="game-result" id="gameResult">*</span>
      </div>

      <div class="board-container">
        <div class="eval-bar-wrapper" title="شريط تقييم الموقف">
          <div id="evalBarFill" class="eval-bar-fill" style="height: 50%;"></div>
          <span id="evalScoreText" class="eval-score-text">0.0</span>
        </div>

        <div id="board" class="board"></div>
      </div>

      <div class="controls">
        <button id="btnStart" title="البداية">«</button>
        <button id="btnPrev" title="السابق">‹</button>
        <button id="btnPlay" class="play-btn" title="تشغيل/إيقاف">▶</button>
        <button id="btnNext" title="التالي">›</button>
        <button id="btnEnd" title="النهاية">»</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="card stats-card">
        <h3>📊 نتائج دقة المباراة</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">الافتتاح</span>
            <span id="accOpening" class="stat-value">--%</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">وسط الدور</span>
            <span id="accMiddle" class="stat-value">--%</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">نهاية الدور</span>
            <span id="accEnd" class="stat-value">--%</span>
          </div>
          <div class="stat-box highlight">
            <span class="stat-label">الدقة الكلية</span>
            <span id="accTotal" class="stat-value">--%</span>
          </div>
        </div>
      </div>

      <div class="card pgn-input-card">
        <h3>تحميل مباراة PGN</h3>
        <textarea id="pgnInput" placeholder="الصق كود الـ PGN هنا أو اسحب ملف .pgn وأسقطه فوق الرقعة..."></textarea>
        <div class="button-group">
          <button id="btnLoadPgn" class="btn-primary">تحليل الـ PGN</button>
          <label for="fileInput" class="btn-secondary">
            رفع ملف
            <input type="file" id="fileInput" accept=".pgn" hidden>
          </label>
        </div>
      </div>

      <div class="card moves-card">
        <h3>سجل التحركات وتقييم النقلات</h3>
        <div id="movesList" class="moves-list"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
