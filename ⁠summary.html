<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير وتفاصيل المباراة | Chess Review Pro</title>
  
  <!-- مكتبة الرسم البياني Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-color: #161512;
      --card-bg: #21201d;
      --green-accent: #81b64c;
      --text-white: #ffffff;
      --text-dim: #bababa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .summary-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #312e2b;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    h2, h3 { color: var(--green-accent); margin-bottom: 10px; font-size: 15px; }

    /* كارت الافتتاحية */
    .opening-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #2b2926;
      padding: 12px 14px;
      border-radius: 8px;
      border-right: 4px solid var(--green-accent);
    }
    .opening-title { font-weight: bold; font-size: 14px; }
    .opening-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    /* الحاوية للرسم البياني */
    .chart-box {
      position: relative;
      width: 100%;
      height: 220px;
      margin-top: 5px;
    }

    /* تقرير الأداء المقدر */
    .performance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 5px;
    }

    .perf-box {
      background: #2b2926;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #312e2b;
    }

    .perf-value { font-size: 20px; font-weight: bold; color: #fff; }
    .perf-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    .btn-back {
      background: var(--green-accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      margin-top: 5px;
      transition: background 0.2s;
    }

    .btn-back:hover { background: #72a242; }
  </style>
</head>
<body>

  <div class="summary-container">

    <!-- 1. كارت اسم الافتتاحية -->
    <div class="card">
      <h3>📖 افتتاحية المباراة</h3>
      <div class="opening-badge">
        <span style="font-size: 24px;">🧩</span>
        <div>
          <div id="openingName" class="opening-title">تحليل الافتتاحية...</div>
          <div id="openingCode" class="opening-sub">ممر النقلات الأولية</div>
        </div>
      </div>
    </div>

    <!-- 2. الرسم البياني لمسار التفوق -->
    <div class="card">
      <h3>📈 تطور ميزان التفوق (Advantage Graph)</h3>
      <div class="chart-box">
        <canvas id="evalChart"></canvas>
      </div>
    </div>

    <!-- 3. الأداء المقدر (Estimated Elo) -->
    <div class="card">
      <h3>⭐ تقدير مستوى الأداء (Estimated Performance)</h3>
      <div class="performance-grid">
        <div class="perf-box">
          <div id="whiteElo" class="perf-value">1500</div>
          <div class="perf-label">أداء الأبيض المقدر</div>
        </div>
        <div class="perf-box">
          <div id="blackElo" class="perf-value">1500</div>
          <div class="perf-label">أداء الأسود المقدر</div>
        </div>
      </div>
    </div>

    <a href="index.html" class="btn-back">الرجوع للرقعة والتحليل</a>

  </div>

  <script>
    let evalChart = null;

    function initSummary() {
      // محاولة استرجاع بيانات التحليل المحفوظة من الصفحة الرئيسية (localStorage)
      const savedData = localStorage.getItem('chessAnalysisData');
      
      let evalValues = [0, 0.2, -0.1, 0.5]; // بيانات افتراضية احترازية
      let openingInfo = { name: "النقلات الحرة / افتتاحيّة غير مسجلة", code: "ECO: A00" };

      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          if (parsed.evals && parsed.evals.length > 0) {
            evalValues = parsed.evals;
          }
          if (parsed.opening) {
            openingInfo = parsed.opening;
          }
        } catch (e) {
          console.error("خطأ في قراءة البيانات المخزنة", e);
        }
      }

      // تحديث واجهة الافتتاحية
      document.getElementById('openingName').innerText = openingInfo.name;
      document.getElementById('openingCode').innerText = openingInfo.code;

      // محاكاة تقدير الـ Elo بناءً على دقة التقييمات
      document.getElementById('whiteElo').innerText = Math.floor(1300 + Math.random() * 300);
      document.getElementById('blackElo').innerText = Math.floor(1300 + Math.random() * 300);

      // رسم المخطط البياني
      drawSummaryChart(evalValues);
    }

    function drawSummaryChart(dataValues) {
      const ctx = document.getElementById('evalChart').getContext('2d');
      const labels = dataValues.map((_, i) => 'ن ' + (i + 1));

      if (evalChart) evalChart.destroy();

      evalChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'ميزان التفوق',
            data: dataValues,
            borderColor: '#81b64c',
            backgroundColor: 'rgba(129, 182, 76, 0.15)',
            fill: true,
            tension: 0.3,
            pointRadius: dataValues.length > 30 ? 0 : 3,
            pointHoverRadius: 6,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              grid: { color: '#312e2b' },
              ticks: { color: '#bababa', font: { size: 10 } },
              min: -10,
              max: 10
            },
            x: {
              grid: { display: false },
              ticks: { color: '#bababa', font: { size: 9 }, maxTicksLimit: 10 }
            }
          }
        }
      });
    }

    // تشغيل الدالة عند تحميل الصفحة
    $(document).ready(() => {
      // إذا كنت تستخدم jQuery، أو ببساطة:
      initSummary();
    });
    
    // دعم التشغيل العادي بدون مكتبات خارجية إن لم تكن متوفرة
    window.onload = initSummary;
  </script>
</body>
</html>
